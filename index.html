<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />

    <title>Mohamed Ben Moussa · Full-Stack & Web3 Engineer</title>

      name="description"
      content="Full-stack and Web3 engineer in Morocco. dApps, tokenization, DeFi and AI agents, built into products people enjoy using."

    <meta
      property="og:title"
      content="Mohamed Ben Moussa · Full-Stack & Web3 Engineer"

    <meta name="twitter:image" content="https://www.themoorish.dev/og.png" />

    <!-- Dark by default; apply a saved choice before first paint. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark')
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
